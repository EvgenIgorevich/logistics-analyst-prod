name: Logistics Bot Launcher

on:
  schedule:
    - cron: '0 7 * * 3' # Среда 10:00 МСК
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Run bot
        run: python main.py
